<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fransyl — Veille stratégique</title>
<style>
  :root{
    --paper:#EEEBE4; --surface:#FFFFFF; --ink:#16181A; --ink-mute:#5C6066;
    --line:#DAD6CC; --accent:#FC5000;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#131417; --surface:#1D1F24; --ink:#EDEBE6; --ink-mute:#A7ABB0; --line:#2A2D33; --accent:#FF6A2A; }
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:var(--font); background:var(--paper); color:var(--ink); line-height:1.55; padding:60px 24px; }
  .wrap{ max-width:640px; margin:0 auto; }
  h1{ font-size:26px; font-weight:800; margin-bottom:8px; letter-spacing:-0.3px; }
  .sub{ font-size:14px; color:var(--ink-mute); margin-bottom:36px; }
  .edition{ display:block; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:8px; padding:18px 20px; margin-bottom:12px; text-decoration:none; color:inherit; }
  .edition:hover{ border-left-width:6px; }
  .edition .title{ font-weight:700; font-size:15.5px; margin-bottom:4px; }
  .edition .meta{ font-size:12.5px; color:var(--ink-mute); }
  footer{ margin-top:48px; font-size:11.5px; color:var(--ink-mute); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Groupe Fransyl</h1>
  <div class="sub">Veille stratégique — éditions mensuelles</div>

  <a class="edition" href="/2026-08/">
    <div class="title">Édition d'août 2026</div>
    <div class="meta">Contenu couvrant juillet 2026 — 13 signaux</div>
  </a>

  <footer>Diffusion restreinte — usage interne uniquement.</footer>
</div>
</body>
</html>
