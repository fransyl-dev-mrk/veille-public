<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fransyl — Proposer un ajout à la veille</title>
<style>
  :root{
    --paper:#EEEBE4; --surface:#F8F6F2; --surface2:#FFFFFF;
    --ink:#16181A; --ink-mute:#4B4E52; --ink-faint:#84888D;
    --line:#DAD6CC; --line-strong:#C4BFB2;
    --accent:#FC5000; --accent-ink:#FFFFFF;
    --axis1:#A8391D;
    --shadow: 0 1px 2px rgba(20,18,14,0.04), 0 6px 20px rgba(20,18,14,0.05);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif;
  }
  :root[data-theme="dark"]{
    --paper:#131417; --surface:#191B1F; --surface2:#1D1F24;
    --ink:#EDEBE6; --ink-mute:#B3B7BC; --ink-faint:#787C82;
    --line:#2A2D33; --line-strong:#383C43;
    --accent:#FF6A2A; --accent-ink:#151312;
    --axis1:#DE8158;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#131417; --surface:#191B1F; --surface2:#1D1F24;
      --ink:#EDEBE6; --ink-mute:#B3B7BC; --ink-faint:#787C82;
      --line:#2A2D33; --line-strong:#383C43;
      --accent:#FF6A2A; --accent-ink:#151312;
      --axis1:#DE8158;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:var(--font); background:var(--paper); color:var(--ink); line-height:1.6; font-size:15px; }
  a{ color:inherit; }

  .theme-toggle{ position:fixed; top:16px; right:16px; z-index:60; width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--surface2); color:var(--ink); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); }
  .theme-toggle:hover{ border-color:var(--accent); }

  .wrap{ max-width:560px; margin:0 auto; padding:56px 24px 80px; }
  .back-link{ display:inline-block; margin-bottom:22px; font-size:12.5px; color:var(--ink-faint); text-decoration:none; border-bottom:1px solid var(--line-strong); }
  .back-link:hover{ color:var(--accent); border-color:var(--accent); }

  h1{ font-size:26px; font-weight:800; letter-spacing:-0.3px; margin-bottom:8px; }
  .sub{ font-size:14px; color:var(--ink-mute); margin-bottom:32px; }

  .card{ background:var(--surface2); border:1px solid var(--line); border-top:3px solid var(--accent); border-radius:10px; padding:28px 26px; box-shadow:var(--shadow); }

  label{ font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:7px; display:block; }
  .field{ margin-bottom:18px; }
  input, select, textarea{ width:100%; font-family:var(--font); font-size:14.5px; padding:11px 13px; border:1px solid var(--line-strong); border-radius:6px; background:var(--paper); color:var(--ink); }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--accent); }
  textarea{ resize:vertical; min-height:100px; }

  .btn{ width:100%; font-family:var(--font); font-size:14px; font-weight:700; padding:12px; border:none; border-radius:6px; cursor:pointer; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .status{ font-size:12.5px; margin-top:12px; display:none; }
  .status.show{ display:block; }
  .status.ok{ color:#2F6B4A; }
  .status.err{ color:var(--axis1); }

  footer{ margin-top:24px; font-size:11.5px; color:var(--ink-faint); }
</style>
</head>
<body>

<button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Basculer le mode clair/sombre" title="Mode clair / sombre">🌙</button>

<div class="wrap">
  <a href="/" class="back-link">← Toutes les éditions</a>
  <h1>Proposer un ajout</h1>
  <div class="sub">Un concurrent, une source ou un thème qui devrait être suivi ? Décrivez-le ci-dessous — l'équipe marketing sera avisée.</div>

  <div class="card">
    <form id="suggestion-form">
      <div class="field">
        <label for="s-name">Votre nom (optionnel)</label>
        <input type="text" id="s-name" autocomplete="name">
      </div>
      <div class="field">
        <label for="s-category">Catégorie</label>
        <select id="s-category">
          <option value="Compétiteurs">Compétiteurs</option>
          <option value="Environnement d'affaires">Environnement d'affaires</option>
          <option value="Environnement technologique">Environnement technologique</option>
          <option value="Autre">Autre</option>
        </select>
      </div>
      <div class="field">
        <label for="s-desc">Description de la suggestion</label>
        <textarea id="s-desc" placeholder="Ex. : suivre le concurrent X, la source Y, ou le thème Z..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary" id="s-submit">Envoyer la suggestion</button>
      <div class="status" id="s-status"></div>
    </form>
  </div>

  <footer>Diffusion restreinte — usage interne uniquement.</footer>
</div>

<script src="/theme.js"></script>
<script>
/* ---------- SUGGESTION ----------
   WEBHOOK_URL : coller ici l'URL "Catch Hook" d'un Zap (Webhooks by Zapier -> Gmail : Send Email)
   une fois créé. Tant que c'est vide, le formulaire ouvre le client courriel local (mailto:) —
   fonctionnel dès maintenant, sans dépendance externe. */
const WEBHOOK_URL = "";
const NOTIFY_EMAIL = "marketing@fransyl.com";

const form = document.getElementById('suggestion-form');
const statusEl = document.getElementById('s-status');
const submitBtn = document.getElementById('s-submit');

function showStatus(msg, ok){
  statusEl.textContent = msg;
  statusEl.className = 'status show ' + (ok ? 'ok' : 'err');
}

function mailtoFallback(payload){
  const subject = encodeURIComponent('Suggestion veille — ' + payload.category);
  const body = encodeURIComponent(
    'Catégorie : ' + payload.category + '\n' +
    'De : ' + (payload.name || '(non précisé)') + '\n\n' +
    payload.description
  );
  window.location.href = 'mailto:' + NOTIFY_EMAIL + '?subject=' + subject + '&body=' + body;
}

form.addEventListener('submit', async function(e){
  e.preventDefault();
  const payload = {
    name: document.getElementById('s-name').value.trim(),
    category: document.getElementById('s-category').value,
    description: document.getElementById('s-desc').value.trim(),
    page: window.location.href,
    date: new Date().toISOString()
  };
  if(!payload.description){
    showStatus('Merci de décrire la suggestion.', false);
    return;
  }

  if(!WEBHOOK_URL){
    mailtoFallback(payload);
    showStatus('Ouverture de votre client courriel...', true);
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Envoi...';
  try{
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    showStatus('Suggestion envoyée — merci !', true);
    form.reset();
  } catch(err){
    showStatus('Envoi automatique indisponible, ouverture du client courriel...', false);
    mailtoFallback(payload);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Envoyer la suggestion';
  }
});
</script>
</body>
</html>
